<!doctype html>
<!-- 临时预览页（截图用，看完即删）：在浏览器里用一套 wx 垫片跑小游戏版，方便肉眼检查界面 -->
<html lang="zh-CN"><head><meta charset="utf-8"><title>残域小游戏版 · 预览</title>
<style>html,body{margin:0;background:#0a0d13}canvas{display:block;margin:0 auto}</style></head>
<body>
<canvas id="c" width="375" height="812"></canvas>
<script>
  window.onerror = function (m, s, l) {
    const p = document.createElement('pre');
    p.id = 'err';
    p.textContent = 'ERR ' + m + ' @ ' + s + ':' + l;
    document.body.appendChild(p);
  };
</script>
<script>
  const store = {};
  window.wx = {
    createCanvas: () => document.getElementById('c'),
    getWindowInfo: () => ({ windowWidth: 375, windowHeight: 812, pixelRatio: 1, safeArea: { top: 0 } }),
    getSystemInfoSync: () => ({ windowWidth: 375, windowHeight: 812, pixelRatio: 1, safeArea: { top: 0 } }),
    getStorageSync: k => (k in store ? store[k] : ''),
    setStorageSync: (k, v) => { store[k] = v; },
    removeStorageSync: k => { delete store[k]; },
    getStorageInfoSync: () => ({ keys: Object.keys(store) }),
    onTouchStart() {}, onTouchMove() {}, onTouchEnd() {}, onShow() {}, onHide() {},
  };
  window.GameGlobal = window;
  // 小游戏环境自带 CommonJS（require / module.exports），浏览器里得自己垫一层
  window.__reg = {};
  window.module = { exports: {} };
  window.require = p => window.__reg[String(p).replace(/^\.\//, '').replace(/\.js$/, '')];
</script>
<script src="_preview_bundle.js"></script>
<script>
  // 造一个"玩了一阵子"的档，这样截图里能看到真实内容（而不是空号）
  try {
    GameGlobal.UI.boot();
  } catch (e) {
    const p = document.createElement('pre'); p.id = 'err'; p.textContent = 'BOOT ERR ' + e.message + '\n' + e.stack;
    document.body.appendChild(p);
  }
  const Core = window.Core, D = window.DATA, CV = window.CV;
  Core.setPlayerName('执灯者');
  Core.S.player.bloodline = Object.keys(D.BLOODLINES)[0];
  Core.S.player.level = 28;
  Core.S.player.geneLock = 2;
  ['C021','C022','C023','C067','C101'].forEach(id => { if (D.charById[id]) Core.addChar(id); });
  Core.S.party = ['@player','C021','C022','C023', null];
  Core.addCur('points', 268000); Core.addCur('holy', 1240); Core.addCur('otherworld', 3860);
  Core.S.cur.story = 780; Core.S.cur.corridor = 42;
  Core.S.stats.battles = 96; Core.S.stats.recruits = 23;
  Core.S.worlds.W01.stages.normal = Array(12).fill(2);
  Core.S.idle.bankSec = 5400;
  Core.S.garden = [{ id: D.GARDEN[0].id, at: Date.now() + 300000 }, null, null,
                   { id: D.GARDEN[2].id, at: Date.now() - 1000 }];
  Core.S.travel.bankSec = D.TRAVEL_EVERY_SEC * 0.45;
  Core.S.login.day = 3;
  for (let i = 0; i < 12; i++) Core.grantEquip('W05', 'SSR');
  Core.grantEquip('W08', 'UR');
  Core.save();
  CV.reset('home');
  try { CV.draw(); } catch (e) {
    const p = document.createElement('pre'); p.id = 'err'; p.textContent = 'DRAW ERR ' + e.message + '\n' + e.stack;
    document.body.appendChild(p);
  }
  const d = document.createElement('pre'); d.id = 'diag';
  d.textContent = JSON.stringify({ W: CV.W, H: CV.H, TOP: CV.TOP, DPR: CV.DPR, panel: CV.top() && CV.top().name, hits: CV.hits.length });
  document.body.appendChild(d);
</script>
</body></html>
