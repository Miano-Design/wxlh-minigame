          - generic [ref=e358]:
            - heading "wx.requestSubscribeMessage(Object object)" [level=1] [ref=e359]
            - blockquote [ref=e360]:
              - paragraph [ref=e361]:
                - text: 基础库 2.4.4 开始支持，低版本需做
                - link "兼容处理" [ref=e362] [cursor=pointer]:
                  - /url: ../../../guide/runtime/client-lib/compatibility.html
                - text: 。
            - blockquote [ref=e363]:
              - paragraph [ref=e364]:
                - strong [ref=e365]:
                  - text: 以
                  - link "Promise 风格" [ref=e366] [cursor=pointer]:
                    - /url: ../../../game-engine/worker/api.html#%E5%BC%82%E6%AD%A5-API-%E8%BF%94%E5%9B%9E-Promise
                  - text: 调用
                - text: ：支持
              - paragraph [ref=e367]:
                - strong [ref=e368]: 微信 Windows 版
                - text: ：支持
              - paragraph [ref=e369]:
                - strong [ref=e370]: 微信 Mac 版
                - text: ：支持
              - paragraph [ref=e371]:
                - strong [ref=e372]: 微信 鸿蒙 OS 版
                - text: ：支持
              - paragraph [ref=e373]:
                - strong [ref=e374]: 限制
                - text: ：仅在
                - link "点击行为" [ref=e375] [cursor=pointer]:
                  - /url: ../../../guide/base-ability/touch-limit.html
                - text: 时调用
            - heading "功能描述" [level=2] [ref=e376]
            - paragraph [ref=e377]:
              - text: 调起客户端小游戏订阅消息界面，返回用户订阅消息的操作结果。当用户勾选了订阅面板中的“总是保持以上选择，不再询问”时，模板消息会被添加到用户的小游戏设置页，通过
              - link "wx.getSetting" [ref=e378] [cursor=pointer]:
                - /url: ../setting/wx.getSetting.html
              - text: 接口可获取用户对相关模板消息的订阅状态。
            - heading "注意事项" [level=2] [ref=e379]
            - list [ref=e380]:
              - listitem [ref=e381]: 一次性模板 id 和永久模板 id 不可同时使用。
              - listitem [ref=e382]: 低版本基础库2.4.4~2.8.3 已支持订阅消息接口调用，仅支持传入一个一次性 tmplId / 永久 tmplId。
              - listitem [ref=e383]:
                - link "2.8.2" [ref=e384] [cursor=pointer]:
                  - /url: ../../../guide/runtime/client-lib/compatibility.html
                - text: 版本开始，用户发生点击行为或者发起支付回调后，才可以调起订阅消息界面。
              - listitem [ref=e385]:
                - link "2.10.0" [ref=e386] [cursor=pointer]:
                  - /url: ../../../guide/runtime/client-lib/compatibility.html
                - text: 版本开始，开发版和体验版小游戏将禁止使用模板消息 fomrId。
              - listitem [ref=e387]:
                - text: 使用前建议阅读
                - link "小游戏订阅消息使用指引" [ref=e388] [cursor=pointer]:
                  - /url: ../../../guide/open-ability/subscribe-message.html
                - text: 。
              - listitem [ref=e389]: 一次授权调用里，每个tmplId对应的模板标题不能存在相同的，若出现相同的，只保留一个。
            - heading "参数" [level=2] [ref=e390]
            - heading "Object object" [level=3] [ref=e391]
