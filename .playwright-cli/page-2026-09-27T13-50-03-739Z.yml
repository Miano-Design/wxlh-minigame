                  - 'cell "[TEMPLATE_ID]是动态的键，即模板id，值包括''accept''、''reject''、''ban''、''filter''。''accept''表示用户同意订阅该条id对应的模板消息，''reject''表示用户拒绝订阅该条id对应的模板消息，''ban''表示已被后台封禁，''filter''表示该模板因为模板标题同名被后台过滤。例如 { errMsg: \"requestSubscribeMessage:ok\", zun-LzcQyW-edafCVvzPkK4de2Rllr1fFpw2A_x0oXE: \"accept\"} 表示用户同意订阅zun-LzcQyW-edafCVvzPkK4de2Rllr1fFpw2A_x0oXE这条消息" [ref=e444]'
