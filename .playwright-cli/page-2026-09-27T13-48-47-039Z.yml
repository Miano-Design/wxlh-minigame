    - main [ref=e261]:
      - generic [ref=e262]:
        - generic [ref=e263]:
          - generic [ref=e264]:
            - generic [ref=e265]: 开发指引 /
            - generic [ref=e266]: 核心能力 /
            - generic [ref=e267]: 云函数 /
            - generic [ref=e268]: 定时触发器
          - generic [ref=e269]:
            - heading "定时触发器" [level=1] [ref=e270]
            - blockquote [ref=e271]:
              - paragraph [ref=e272]: 该功能需开发者工具 1.02.1811270 及以上版本方可使用
              - paragraph [ref=e273]: 从开发者工具 1.02.1910182 开始，新上传的定时触发器内支持使用云调用
            - paragraph [ref=e274]: 如果云函数需要定时 / 定期执行，也就是定时触发，我们可以使用云函数定时触发器。配置了定时触发器的云函数，会在相应时间点被自动触发，函数的返回结果不会返回给调用方。
            - paragraph [ref=e275]:
              - text: 在需要添加触发器的云函数目录下新建文件
              - code [ref=e276]: config.json
              - text: ，格式如下：
            - code [ref=e279]: "{ // triggers 字段是触发器数组，目前仅支持一个触发器，即数组只能填写一个，不可添加多个 \"triggers\": [ { // name: 触发器的名字，规则见下方说明 \"name\": \"myTrigger\", // type: 触发器类型，目前仅支持 timer (即 定时触发器) \"type\": \"timer\", // config: 触发器配置，在定时触发器下，config 格式为 cron 表达式，规则见下方说明 \"config\": \"0 0 2 1 * * *\" } ] }"
            - paragraph [ref=e280]: 字段规则：
            - list [ref=e281]:
              - listitem [ref=e282]:
                - text: 定时触发器名称 (name)：最大支持 60 个字符，支持
                - code [ref=e283]: a-z
                - text: ","
                - code [ref=e284]: A-Z
                - text: ","
                - code [ref=e285]: 0-9
                - text: ","
                - code [ref=e286]: "-"
                - text: 和
                - code [ref=e287]: _
                - text: 。必须以字母开头，且一个函数下不支持同名的多个定时触发器。
              - listitem [ref=e288]: 定时触发器触发周期 (config)：指定的函数触发时间。填写自定义标准的 cron 表达式来决定何时触发函数。有关 cron 表达式的更多信息，请参考下面的内容。
            - heading "Cron 表达式" [level=3] [ref=e289]
            - paragraph [ref=e290]: Cron 表达式有七个必需字段，按空格分隔。
            - table [ref=e292]:
              - rowgroup [ref=e293]:
                - row [ref=e294]:
                  - columnheader "第一位" [ref=e295]
                  - columnheader "第二位" [ref=e296]
                  - columnheader "第三位" [ref=e297]
                  - columnheader "第四位" [ref=e298]
                  - columnheader "第五位" [ref=e299]
                  - columnheader "第六位" [ref=e300]
                  - columnheader "第七位" [ref=e301]
              - rowgroup [ref=e302]:
                - row [ref=e303]:
                  - cell "秒" [ref=e304]
                  - cell "分钟" [ref=e305]
                  - cell "小时" [ref=e306]
                  - cell "日" [ref=e307]
                  - cell "月" [ref=e308]
                  - cell "星期" [ref=e309]
                  - cell "年" [ref=e310]
            - paragraph [ref=e311]: 其中，每个字段都有相应的取值范围：
            - table [ref=e313]:
              - rowgroup [ref=e314]:
                - row [ref=e315]:
                  - columnheader "字段" [ref=e316]
                  - columnheader "值" [ref=e317]
                  - columnheader "通配符" [ref=e318]
              - rowgroup [ref=e319]:
                - row [ref=e320]:
                  - cell "秒" [ref=e321]
                  - cell "0-59 的整数" [ref=e322]
                  - cell ", - * /" [ref=e323]
                - row [ref=e324]:
                  - cell "分钟" [ref=e325]
                  - cell "0-59 的整数" [ref=e326]
                  - cell ", - * /" [ref=e327]
                - row [ref=e328]:
                  - cell "小时" [ref=e329]
                  - cell "0-23 的整数" [ref=e330]
                  - cell ", - * /" [ref=e331]
                - row [ref=e332]:
                  - cell "日" [ref=e333]
                  - cell "1-31 的整数（需要考虑月的天数）" [ref=e334]
                  - cell ", - * /" [ref=e335]
                - row [ref=e336]:
                  - cell "月" [ref=e337]
                  - cell "1-12 的整数 或 JAN,FEB,MAR,APR,MAY,JUN,JUL,AUG,SEP,OCT,NOV,DEC" [ref=e338]
                  - cell ", - * /" [ref=e339]
                - row [ref=e340]:
                  - cell "星期" [ref=e341]
                  - cell "0-6 的整数 或 SUN,MON,TUE,WED,THU,FRI,SAT；其中 0 指周日，1 指周一，依次类推，6 指周六" [ref=e342]
                  - cell ", - * /" [ref=e343]
                - row [ref=e344]:
                  - cell "年" [ref=e345]
                  - cell "1970~2099 的整数" [ref=e346]
                  - cell ", - * /" [ref=e347]
            - paragraph [ref=e348]:
              - strong [ref=e349]: 通配符
            - table [ref=e351]:
              - rowgroup [ref=e352]:
                - row [ref=e353]:
                  - columnheader "通配符" [ref=e354]
                  - columnheader "含义" [ref=e355]
              - rowgroup [ref=e356]:
                - row [ref=e357]:
                  - cell ", (逗号)" [ref=e358]
                  - cell "代表取用逗号隔开的字符的并集。例如：在“小时”字段中 1,2,3 表示 1 点、2 点和 3 点" [ref=e359]
                - row [ref=e360]:
                  - cell "- (破折号)" [ref=e361]
                  - cell "包含指定范围的所有值。例如：在“日”字段中，1-15 包含指定月份的 1 号到 15 号" [ref=e362]
                - row [ref=e363]:
                  - cell "* (星号)" [ref=e364]
                  - cell "表示所有值。在“小时”字段中，* 表示每个小时" [ref=e365]
                - row [ref=e366]:
                  - cell "/ (正斜杠)" [ref=e367]
                  - cell "指定增量。在“分钟”字段中，输入 1/10 以指定从第一分钟开始的每隔十分钟重复。例如，第 11 分钟、第 21 分钟和第 31 分钟，依此类推" [ref=e368]
            - paragraph [ref=e369]:
              - strong [ref=e370]: 注意事项
            - list [ref=e371]:
              - listitem [ref=e372]: 在 Cron 表达式中的“日”和“星期”字段同时指定值时，两者为“或”关系，即两者的条件分别均生效。
              - listitem [ref=e373]: 触发器规则的时区为 UTC+8
              - listitem [ref=e374]: 由于网络环境不稳定，微信可能会多次推送同一条消息。建议将消息 ID 作为唯一标识做好去重，防止业务逻辑重复执行。
            - paragraph [ref=e375]:
              - strong [ref=e376]: 示例
            - paragraph [ref=e377]: 下面展示了一些 Cron 表达式和相关含义的示例：
            - list [ref=e378]:
              - listitem [ref=e379]:
                - code [ref=e380]: "*/5 * * * * * *"
                - text: 表示每 5 秒触发一次
              - listitem [ref=e381]:
                - code [ref=e382]: 0 0 2 1 * * *
                - text: 表示在每月的 1 日的凌晨 2 点触发
              - listitem [ref=e383]:
                - code [ref=e384]: 0 15 10 * * MON-FRI *
                - text: 表示在周一到周五每天上午 10:15 触发
              - listitem [ref=e385]:
                - code [ref=e386]: 0 0 10,14,16 * * * *
                - text: 表示在每天上午 10 点，下午 2 点，4 点触发
              - listitem [ref=e387]:
                - code [ref=e388]: 0 */30 9-17 * * * *
                - text: 表示在每天上午 9 点到下午 5 点内每半小时触发
              - listitem [ref=e389]:
                - code [ref=e390]: 0 0 12 * * WED *
                - text: 表示在每个星期三中午 12 点触发
            - heading "环境信息" [level=3] [ref=e391]
            - paragraph [ref=e392]:
              - text: 在云函数内，可以通过
              - code [ref=e393]: getWXContext().SOURCE === 'wx_trigger'
              - text: 判断调用来源是触发器。（附：
              - link "所有调用来源列表" [ref=e394] [cursor=pointer]:
                - /url: ../../reference-sdk-api/utils/Cloud.getWXContext
              - text: ）
            - paragraph [ref=e395]:
              - text: 在
              - link "下一章节" [ref=e396] [cursor=pointer]:
                - /url: mechanism
              - text: ，我们一起了解下云函数的运行机制。
