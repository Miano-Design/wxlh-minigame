<!doctype html><html lang="zh-CN"><head><meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>对比用（网页版布局）</title>
<link rel="stylesheet" href="../wxlh-game/css/style.css" />
</head><body>
<div id="app">
  <header id="topbar"><div class="player-row">
    <span class="pname" id="tb-name">执灯者</span><span class="plv" id="tb-lv">Lv.1</span>
    <span class="genelock" id="tb-gene"></span><span class="tb-spacer"></span>
  </div><div id="curbar"></div></header>
  <main id="view"></main><nav id="navbar"></nav>
</div>
<div id="modal-root"></div><div id="toast-root"></div><div id="battle-root"></div>
<script src="../wxlh-game/js/data.js"></script>
<script src="../wxlh-game/js/core.js"></script>
<script src="../wxlh-game/js/battle.js"></script>
<script src="../wxlh-game/js/dungeon.js"></script>
<script src="../wxlh-game/js/ui.js"></script>
<script>
(function () {
  var p = (location.search.match(/p=(\\w+)/) || [])[1] || 'home';
  try {
    window.Core.newGame();
    window.Core.setPlayerName('对比用');
    try { window.Core.choosePlayerBloodline(Object.keys(window.DATA.BLOODLINES)[0]); } catch (e) {}
    window.UI.init();
    if (window.UI._setTab) window.UI._setTab(p);
    var rows = [];
    var walk = function (el, depth) {
      if (depth > 6) return;
      var r = el.getBoundingClientRect();
      if (r.width > 0 || r.height > 0) {
        rows.push((el.className || el.tagName).toString().split(' ')[0] + '|' + Math.round(r.left) + ',' + Math.round(r.top) + ',' + Math.round(r.width) + 'x' + Math.round(r.height));
      }
      Array.prototype.forEach.call(el.children, function (c) { walk(c, depth + 1); });
    };
    walk(document.getElementById('view'), 0);
    var pre = document.createElement('pre'); pre.id = 'rects'; pre.textContent = rows.join('\\n');
    document.body.appendChild(pre);
    document.title = 'OK ' + p + ' ' + rows.length;
    try { parent.postMessage(rows.join('\\n'), '*'); } catch (e) {}
  } catch (e) { document.title = 'ERR ' + e.message; }
})();
</script>
</body></html>
