var TPL = "<view class=\"page\" style=\"width:390px;height:844px;background-color:#07090e;padding:12px\"><view class=\"card\"><view class=\"list-row\"><view class=\"grow\"><text class=\"t1\">主线 · 熟悉身体</text><text class=\"t2\">第 1/16 步 · 完成奖励：◈500</text></view></view></view><view class=\"section-title\">养成</view><view class=\"text-menu\"><view class=\"tile\"><text class=\"tt-name\">灯阁评级</text><text class=\"tt-sub\">Lv.1 · +0.0%</text></view><view class=\"tile\"><text class=\"tt-name\">秘术阁</text><text class=\"tt-sub\">已修 0 级</text></view><view class=\"tile\"><text class=\"tt-name\">法宝</text><text class=\"tt-sub\">0/20 件</text></view><view class=\"tile\"><text class=\"tt-name\">药园</text><text class=\"tt-sub\">0 块在用</text></view><view class=\"tile\"><text class=\"tt-name\">斗法台</text><text class=\"tt-sub\">第 1 台 · 剩 5 次</text></view><view class=\"tile\"><text class=\"tt-name\">坐骑</text><text class=\"tt-sub\">0/7 匹</text></view></view><view class=\"hint\">还没解锁：灯阁权限 / 基地建设 / 铭刻 / 伴生体 / 转生天赋</view></view>";
var STYLE = "html, body{margin: 0;padding: 0;height: 100%}\n/* iOS 上字号 <16px 的输入框，一聚焦就会被系统把整页放大一下（点搜索框整页\"跳\"一下）——\n   输入框统一按 16px 渲染来绕开这个系统行为；桌面上视觉几乎没有差别。 */\ninput, textarea{font-size: 16px !important}\nbody{background: #07090e;color: #e9edf6;font-size: 15px}\n#app{max-width: 520px;margin: 0 auto;min-height: 100%;position: relative;background: linear-gradient(180deg, #0b0e15, #07090e)}\n/* ---------- 顶栏 ---------- */\n/* 两行结构：名字行 → 货币行。\n   V8.6 起顶栏不再放\"设置 / 指南\"图标按钮——那两个入口已经在首页最后一段，\n   同一个功能不出现两次。 */\n#topbar{position: fixed;top: 0;left: 50%;width: 100%;max-width: 520px;background: rgba(7,9,14,.94)}\n#topbar .player-row{display: flex;align-items: center;padding: 10px 14px 4px}\n#topbar .pname{font-weight: 700;font-size: 15px}\n#topbar .plv{font-size: 11px;color: #e6b64c;border: 1px solid #e6b64c66;border-radius: 7px;padding: 0 6px}\n#topbar .genelock{font-size: 11px;color: #d43a4f}\n#topbar .tb-spacer{flex: 1}\n#curbar{display: flex;padding: 2px 14px 10px}\n#curbar::-webkit-scrollbar{display: none}\n.cur-chip{flex: 0 0 auto;display: flex;align-items: center;background: #111621;border: 1px solid #232b3b;border-radius: 7px;padding: 5px 11px;min-height: 40px;font-size: 12px;color: #e9edf6;position: relative}\n.cur-chip.more{color: #7a849b;border-style: dashed}\n.cur-chip b{font-weight: 600}\n/* ---------- 主区域 ---------- */\n/* 正文上边距 = 顶栏实际高度（JS 量出来写进 --topbar-h，含刘海安全区）。\n   原来写死 92px，遇到系统字号调大的机 / 更高的刘海，正文会钻到顶栏底下。 */\n#view{padding: calc(var(--topbar-h, 92px) + 6px) 12px calc(62px + env(safe-area-inset-bottom) + 16px)}\nfrom{opacity: 0}\nto{opacity: 1}\n/* ---------- 面板（统一的\"匾额\"结构） ---------- */\n/* 所有卡片共用一套：近黑底 + 细描边 + 顶部 1px 高光；标题左侧一道竖条。\n   这是全站一致性的根：改这里，首页 / 副本 / 角色 / 背包 / 所有弹窗同时生效。 */\n.card, .panel{background: #111621;border: 1px solid #232b3b;border-radius: 10px;padding: 14px 14px 14px}\n.card h3, .panel h3{margin: 0 0 10px;font-size: 15px;font-weight: 700;display: flex;align-items: center;letter-spacing: .2px;flex-wrap: wrap;min-width: 0}\n.card h3 .sub, .panel h3 .sub{font-size: 11px;color: #7a849b;font-weight: 400;letter-spacing: 0;min-width: 0;text-align: right}\n.section-title{display: flex;align-items: center;font-size: 12px;color: #b6bfd0;font-weight: 600;letter-spacing: 1px;margin: 18px 4px 10px}\n/* ---------- 文字层级与工具类（替代散落的内联 font-size / color / margin） ---------- */\n.hint{font-size: 11px;color: #7a849b;line-height: 1.7}\n.note{font-size: 12px;color: #7a849b;line-height: 1.75}\n.lead{font-size: 13px;color: #b6bfd0;line-height: 1.75}\n.gold{color: #e6b64c}\n.green{color: #56c894}\n.red{color: #d43a4f}\n.blue{color: #6ec6ff}\n.dim{color: #7a849b}\n.strong{font-weight: 700}\n.empty{text-align: center;color: #7a849b;font-size: 12px;padding: 24px 0}\n/* ---------- 按钮 ---------- */\n/* ---------- 按钮 ---------- */\n/* 三级就够：primary（主动作·实心红）/ gold（资源相关·实心金）/ 默认（次要·描边）。\n   ghost 是\"更轻的次要\"，用于取消、返回。不再出现第四第五种按钮长相。 */\n.btn{display: inline-flex;align-items: center;justify-content: center;min-height: 44px;padding: 0 18px;border-radius: 7px;border: 1px solid #333e55;background: #161d2a;color: #e9edf6;font-size: 13px;font-weight: 600;position: relative}\n.btn:active{background: #1d2534}\n.btn.primary{background: linear-gradient(180deg, #c9364a, #97273a);border-color: #e05a6d40}\n.btn.gold{background: linear-gradient(180deg, #b98d2a, #87631a);border-color: #e6b64c44;color: #fdf3dc}\n.btn.ghost{background: transparent;border-color: #232b3b;color: #b6bfd0}\n/* 全局交互规则：所有可点元素热区 ≥ 44×44（小按钮也不再\"点不准\"） */\n.btn.small{min-height: 40px;min-width: 44px;padding: 0 13px;font-size: 12px;border-radius: 7px}\n.btn.block{display: flex;width: 100%}\n.btn[disabled]{opacity: .34}\n.btn-row{display: flex;flex-wrap: wrap}\n/* 一行里的按钮：字短就并排，字长就自动换行，绝不把文字挤出按钮外\n   （原来 white-space: nowrap + flex:1 会在窄屏上把\"⚡ 一键最优装备\"这类长标签顶出去） */\n.btn-row .btn{flex: 1 1 auto;min-width: 86px;padding: 0 12px;line-height: 1.25;text-align: center}\n/* 一排正好三个小按钮：用网格钉死三列，不会被长标签挤成\"2 + 1\"两行 */\n.btn-grid3{display: grid}\n.btn .dot{position: absolute;top: 5px;right: 7px;width: 7px;height: 7px;border-radius: 50%;background: #d43a4f}\n/* ---------- 底部导航 ---------- */\n#navbar{position: fixed;bottom: 0;left: 50%;width: 100%;max-width: 520px;display: flex;background: rgba(12,15,23,.96);height: calc(62px + env(safe-area-inset-bottom))}\n.nav-item{flex: 1;display: flex;flex-direction: column;align-items: center;justify-content: center;color: #7a849b;font-size: 11px;position: relative}\n.nav-item .ico{font-size: 19px;line-height: 1}\n.nav-item.active{color: #e6b64c}\n.nav-item .dot{position: absolute;top: 8px;right: calc(50% - 18px);width: 7px;height: 7px;border-radius: 50%;background: #d43a4f}\n/* ---------- 角色卡片 ---------- */\n.char-grid{display: grid}\n.char-card{background: #161d2a;border: 1px solid #232b3b;border-radius: 12px;padding: 10px 8px;text-align: center;position: relative}\n.char-card .avatar{width: 46px;height: 46px;margin: 0 auto 6px;border-radius: 50%;display: flex;align-items: center;justify-content: center;font-size: 20px;font-weight: 700;background: #232c42;border: 2px solid #232b3b}\n.char-card .cname{font-size: 13px;font-weight: 600}\n.char-card .cmeta{font-size: 10px;color: #7a849b}\n.char-card .stars{font-size: 10px;color: #e6b64c;letter-spacing: -1px}\n.char-card .inparty{position: absolute;top: 4px;right: 4px;font-size: 9px;background: #d43a4f;border-radius: 6px;padding: 1px 5px}\n.rarity-N{border-color: #5a6373 !important}\n.rarity-R{border-color: #4da3ff !important}\n.rarity-SR{border-color: #b06bff !important}\n.rarity-SSR{border-color: #ffb03a !important}\n.rarity-UR{border-color: #ff4d6d !important}\n.rtext-N{color: #9aa4b2}\n.rtext-R{color: #4da3ff}\n.rtext-SR{color: #b06bff}\n.rtext-SSR{color: #ffb03a}\n.rtext-UR{color: #ff4d6d}\n/* ---------- 队伍 ---------- */\n.party-slots{display: flex}\n.party-slots .pslot{flex: 1 1 0;min-width: 0}\n.pos-row-label{margin: 8px 2px 6px;font-size: 12px;font-weight: 600;color: #e9edf6;display: flex;align-items: baseline}\n.pos-row-label span{font-weight: 400;font-size: 10px;color: #7a849b}\n/* 长按换位：抓起的那块亮起来，其余位置进入\"可放下\"的提示状态 */\n.pslot .pos-hint{position: absolute;right: 8px;bottom: 6px;font-size: 9px;color: #7a849b;opacity: .7}\n.pslot.grabbing{border-color: #e6b64c}\n.party-grid.grabbed .pslot{border-color: #e6b64c99;border-style: dashed}\n.party-grid.grabbed .pslot.grabbing{border-style: solid}\n/* 主角占的是 5 格里的普通一格，只是描边带金、写清他站哪一排 */\n.pslot.protag-slot{border-color: #e6b64c;background: #e6b64c12}\n.pos-row-label .here{font-weight: 600;font-size: 10px;color: #e6b64c}\n/* 拖动中指针压在哪个位置上：那一格（或那一排标题）实心高亮，松手就落在这里 */\n.pslot.drop-target{border-color: #e6b64c !important;border-style: solid !important}\n.pos-row-label.drop-target{color: #e6b64c}\n.pos-row-label.drop-target span{color: #e6b64c;opacity: .9}\n.drag-bar{display: flex;align-items: center;margin: 2px 0 8px;padding: 8px 10px;border-radius: 10px;font-size: 12px;background: #e6b64c1a;border: 1px solid #e6b64c66;color: #e6b64c}\n.drag-bar .btn{min-height: 40px;padding: 4px 12px}\n.pslot{background: #161d2a;border: 1px dashed #232b3b;border-radius: 12px;min-height: 96px;padding: 10px;position: relative}\n.pslot .pos-tag{position: absolute;top: 6px;left: 8px;font-size: 10px;color: #7a849b}\n.pslot.filled{border-style: solid}\n.pslot .avatar{width: 40px;height: 40px;border-radius: 50%;background: #232c42;display: flex;align-items: center;justify-content: center;font-weight: 700;margin: 8px auto 4px}\n.pslot .pname{text-align: center;font-size: 13px;font-weight: 600;min-width: 0}\n.pslot .pmeta{text-align: center;font-size: 10px;color: #7a849b;min-width: 0}\n/* ---------- 进度条 ---------- */\n.bar{height: 8px;background: #0d1120;border-radius: 6px;position: relative}\n.bar > i{display: block;height: 100%;border-radius: 6px;background: #56c894}\n.bar.hp > i{background: linear-gradient(90deg, #37b26c, #5dd39e)}\n.bar.hp.low > i{background: linear-gradient(90deg, #b23737, #d43a4f)}\n.bar.energy > i{background: linear-gradient(90deg, #6a5ae0, #9d8cff)}\n.bar.exp > i{background: linear-gradient(90deg, #b8860b, #e6b64c)}\n.bar .txt{position: absolute;display: flex;align-items: center;justify-content: center;font-size: 9px;color: #fff}\n/* ---------- 列表 ---------- */\n.list-row{display: flex;align-items: center;padding: 10px 4px}\n.list-row .grow{flex: 1;min-width: 0}\n.list-row .t1{font-size: 15px;font-weight: 600;display: flex;align-items: center}\n.list-row .t2{font-size: 11px;color: #7a849b;line-height: 1.6}\n.tag{font-size: 10px;border: 1px solid #333e55;border-radius: 7px;padding: 1px 6px;color: #b6bfd0;font-weight: 400}\n/* ---------- 弹窗（底部抽屉） ---------- */\n#modal-root{position: fixed}\n.modal-mask{position: absolute;background: rgba(0,0,0,.62)}\n.sheet{position: absolute;left: 50%;bottom: 0;width: 100%;max-width: 520px;background: #0b0e15;border: 1px solid #232b3b;border-radius: 18px 18px 0 0;display: flex;flex-direction: column}\nfrom{opacity: 0}\nto{opacity: 1}\n.sheet .sheet-head{display: flex;align-items: center;padding: 14px 18px 12px}\n.sheet .sheet-head h3{margin: 0;font-size: 17px;flex: 1;display: flex;align-items: center;font-weight: 700}\n.sheet .sheet-body{padding: 14px 18px 18px}\n.sheet .close-x{width: 34px;height: 34px;flex: 0 0 auto;border-radius: 7px;border: 1px solid #333e55;background: #111621;color: #7a849b;font-size: 15px}\n.sheet .close-x:active{background: #1d2534}\n/* 图标按钮（关闭 × / 返回 ‹）里的图形一律用**矢量 SVG**画：\n   ① 不用字符——✕ / ‹ 在不同手机落到不同字体，行高与字面框都不一样，所以只有手机看着偏；\n   ② 也不用多根 CSS 线拼——在 2.6x / 3x 这类非整数像素比下，两根线会各自落在半像素上，还是会\"歪\"。\n   SVG 里两个图形的坐标都以 12,12 为中心，所以任何机型、任何缩放下都在正中。\n   另外用伪元素把点击热区撑到 ≥44px（本项目\"热区 ≥44px\"的规则，原来只有 34/40px）。 */\n.sheet .close-x, .back-x{display: flex;align-items: center;justify-content: center;padding: 0;line-height: 1;position: relative}\n.sheet .close-x svg{display: block;width: 16px;height: 16px}\n.back-x svg{display: block;width: 18px;height: 18px}\n/* 居中弹窗：手机键盘弹出时（--kb = 被键盘占掉的高度）整体上移，否则会被键盘盖住看不见 */\n.sheet.center{top: calc(50% - var(--kb, 0px) / 2);bottom: auto;border-radius: 18px;border: 1px solid #232b3b;width: 92%}\nfrom{opacity: 0}\nto{opacity: 1}\n/* ---------- 整页面板（二级内容各占一页，左上角返回） ---------- */\n/* 对标产品的骨架：点系统入口 = 换一页，不是从底部顶上来一叠抽屉。\n   只有确认/提示框还保留居中弹窗（.sheet.center），全局只剩这一种弹窗。 */\n.page{position: absolute;top: 0;bottom: 0;left: 50%;width: 100%;max-width: 520px;background: linear-gradient(180deg, #0b0e15, #07090e);display: flex;flex-direction: column}\nfrom{opacity: 0}\nto{opacity: 1}\n.page .page-head{flex: 0 0 auto;position: relative;display: flex;align-items: center;padding: calc(env(safe-area-inset-top) + 8px) 14px 10px;background: rgba(9,12,18,.96)}\n/* 标题居中 + 底部一道金色短横，做\"匾额\"感；左右各一个等宽占位保证真居中 */\n.page .page-head h3{flex: 1;margin: 0;text-align: center;font-size: 17px;font-weight: 700;letter-spacing: .5px}\n.back-x{width: 40px;height: 40px;flex: 0 0 auto;display: flex;align-items: center;justify-content: center;border: 1px solid #333e55;border-radius: 7px;background: #111621;color: #b6bfd0;font-size: 20px;line-height: 1;padding: 0}\n.back-x:active{background: #1d2534}\n.page-pad{width: 40px;flex: 0 0 auto}\n.page .sheet-body{flex: 1;min-height: 0;padding: 14px 14px calc(env(safe-area-inset-bottom) + 24px)}\n/* ---------- Toast ---------- */\n#toast-root{position: fixed;top: calc(var(--topbar-h, 92px) + 8px);left: 0;right: 0;display: flex;flex-direction: column;align-items: center}\n.toast{background: #000000d9;border: 1px solid #232b3b;border-radius: 999px;padding: 8px 18px;font-size: 13px;max-width: 86%}\nfrom{opacity: 0}\nto{opacity: 1}\n/* ---------- 世界/关卡 ---------- */\n.world-card{display: flex;align-items: center}\n.world-ico{width: 52px;height: 52px;border-radius: 12px;flex: 0 0 auto;display: flex;align-items: center;justify-content: center;font-size: 24px;background: #232c42;border: 1px solid #232b3b}\n.stage-grid{display: grid}\n.stage-cell{border-radius: 10px;background: #161d2a;border: 1px solid #232b3b;display: flex;flex-direction: column;align-items: center;justify-content: center;font-size: 14px;font-weight: 700}\n.stage-cell .st{font-size: 9px;color: #e6b64c;letter-spacing: -1px}\n.stage-cell.locked{opacity: .3}\n.stage-cell.boss{border-color: #d43a4f;color: #d43a4f}\n.stage-cell.done{background: #1d2b22;border-color: #2f5b41}\n.diff-tabs{display: flex}\n.diff-tabs .btn{flex: 1}\n.diff-tabs .btn.active{background: linear-gradient(135deg, #d43a4f, #97273a);border-color: transparent}\n/* ---------- 路线节点 ---------- */\n.route-step{display: flex}\n.route-node{flex: 1;background: #161d2a;border: 1px solid #232b3b;border-radius: 12px;padding: 16px 8px;text-align: center}\n.route-node .nico{font-size: 26px}\n.route-node .nname{font-size: 13px;font-weight: 600}\n.route-node.elite{border-color: #ffb03a66}\n.route-node.event{border-color: #6ec6ff66}\n.route-node.chest{border-color: #ffd76a66}\n.route-node.heal{border-color: #5dd39e66}\n.route-progress{display: flex;justify-content: center;margin: 4px 0 14px}\n.route-progress i{width: 28px;height: 4px;border-radius: 2px;background: #232b3b}\n.route-progress i.done{background: #d43a4f}\n/* ---------- 战斗 ---------- */\n#battle-overlay{position: fixed;background: radial-gradient(ellipse at 50% 30%, #1a1220, #07080d);display: flex;flex-direction: column}\n#battle-overlay .b-head{display: flex;align-items: center;padding: calc(env(safe-area-inset-top) + 10px) 14px 8px}\n#battle-overlay .b-title{font-size: 14px;font-weight: 700;flex: 1}\n.b-field{flex: 1;display: flex;flex-direction: column;justify-content: space-evenly;padding: 0 14px}\n.b-row{display: flex;justify-content: center;flex-wrap: wrap}\n/* 站位可见化：我方分两行（后排在上、前排在下），敌人优先打前排 */\n.b-line-label{text-align: center;font-size: 10px;color: #7a849b;letter-spacing: 1px}\n.b-line-label[data-line=\"front\"]{color: #ffd76a99}\n.b-seamless{position: absolute;left: 50%;top: 50%;background: #0d1220ee;border: 1px solid #e6b64c;color: #e6b64c;border-radius: 12px;padding: 10px 18px;font-size: 13px}\n.b-potions{display: flex;flex-direction: column}\n.b-potions .b-potion-tip{font-size: 10px;color: #7a849b;text-align: center}\n.b-potions > div:last-child{display: flex;flex-wrap: wrap;justify-content: center}\n.unit{width: 30%;max-width: 110px;text-align: center;position: relative}\n.b-row.allies .unit{width: 18%}\n.b-row.allies .unit .u-avatar{width: 46px;height: 46px;font-size: 18px}\n.unit .u-avatar{width: 54px;height: 54px;margin: 0 auto 4px;border-radius: 12px;background: #232c42;border: 2px solid #232b3b;display: flex;align-items: center;justify-content: center;font-size: 22px;font-weight: 700}\n.unit.enemy .u-avatar{border-radius: 50%;background: #2e1a24}\n.unit.boss .u-avatar{border-color: #d43a4f}\n.unit.dead{opacity: .25}\n.unit.acting .u-avatar{border-color: #e6b64c}\n.unit .u-name{font-size: 10px;color: #7a849b}\n.unit .bar{height: 6px}\n.unit .bar.energy{height: 3px}\n/* 血条下面的百分比：带血进场 / 血线告急一眼看得出来（V9.4） */\n.unit .u-hp{font-size: 9px;color: #7a849b}\n.unit .bar.hp.low + .u-hp{color: #d43a4f}\n.floater{position: absolute;left: 50%;top: 0;font-weight: 800;font-size: 15px}\n.floater.crit{color: #e6b64c;font-size: 19px}\n.floater.heal{color: #56c894}\n.floater.dmg{color: #ff8080}\n.floater.miss{color: #7a849b;font-size: 12px}\nto{opacity: 0}\n#battle-log{height: 86px;margin: 8px 14px;padding: 8px 12px;background: #00000066;border: 1px solid #232b3b;border-radius: 10px;font-size: 11px;color: #7a849b}\n#battle-log div{padding: 1px 0}\n.b-controls{display: flex;flex-direction: column;padding: 0 14px calc(env(safe-area-inset-bottom) + 12px)}\n.b-result{position: absolute;background: rgba(5,6,10,.9);display: flex;flex-direction: column;align-items: center;justify-content: center;padding: 20px}\n.b-result h2{font-size: 30px;margin: 0}\n.b-result h2.win{color: #e6b64c}\n.b-result h2.lose{color: #d43a4f}\n.reward-chips{display: flex;flex-wrap: wrap;justify-content: center;max-width: 320px}\n.reward-chip{background: #161d2a;border: 1px solid #232b3b;border-radius: 999px;padding: 4px 12px;font-size: 12px}\n.event-desc{color: #7a849b;font-size: 13px;line-height: 1.7;background: #111621;border-radius: 10px;padding: 12px}\n/* ---------- 其他 ---------- */\n/* 键值行（左标签 / 右数值）只定义这一处；以前这里和上面各写了一份，改一处漏一处 */\n.kv{display: flex;align-items: baseline;justify-content: space-between;font-size: 13px;padding: 5px 0}\n.kv .k{color: #7a849b;flex: 0 1 auto;min-width: 0}\n.kv > span:last-child{text-align: right;min-width: 0;max-width: 64%}\n.grid2{display: grid}\n/* ---------- 副本探索中底栏（替代导航，防误触） ---------- */\n.run-bar{position: fixed;bottom: calc(env(safe-area-inset-bottom) + 8px);left: 50%;width: calc(100% - 16px);max-width: 504px;background: rgba(18,22,34,.97);border: 1px solid #232b3b;border-radius: 14px;padding: 10px 12px}\n.pill-tabs{display: flex}\n.pill-tabs::-webkit-scrollbar{display: none}\n.pill{flex: 0 0 auto;display: flex;align-items: center;padding: 8px 14px;min-height: 44px;border-radius: 999px;border: 1px solid #232b3b;background: #111621;font-size: 12px;color: #7a849b}\n.pill.active{color: #fff;border-color: #d43a4f;background: #d43a4f22}\n.pill-tabs.fill .pill{flex: 1 1 0;justify-content: center}\n/* V9.3：分类胶囊比主标签小一号——主标签 > 分类 > 内容，层次一眼分得出来。\n   仍然留 34px 高（不小于手指能点中的尺寸），只是视觉上退到第二层。 */\n.pill-tabs.tight{flex-wrap: wrap}\n.pill.sm{min-height: 34px;padding: 5px 11px;font-size: 11px}\n/* 分类条右边的\"计数 / 批量分解\"：跟分类同层，不再压到内容最下面 */\n.eq-bar{display: flex;align-items: center;font-size: 11px;color: #7a849b}\n.empty{text-align: center;color: #7a849b;padding: 30px 0;font-size: 13px}\n/* 背包（V9.2）：三池格子制——道具 / 材料 / 装备各 50 格起，\n   格子只写名字和数量，末尾多一格「＋」用来扩容（+10 格一次）。 */\n.bg-head{display: flex;align-items: baseline;font-size: 12px}\n.bg-head .sub{color: #7a849b;font-size: 11px}\n.bg-grid{display: grid}\n.bg-slot{min-height: 52px;border-radius: 10px;border: 1px solid #232b3b;background: #00000022;display: flex;flex-direction: column;align-items: center;justify-content: center;padding: 3px;color: #e9edf6;text-align: center}\n.bg-slot.filled{background: #161d2a}\n.bg-slot.filled:active{background: #1d2534}\n.bg-slot .bg-name{font-size: 9px;line-height: 1.15}\n.bg-slot .bg-count{font-size: 10px;color: #e6b64c;font-weight: 700}\n.bg-slot .bg-sub{font-size: 9px;color: #7a849b}\n.bg-slot.add{border-style: dashed;border-color: #e6b64c;color: #e6b64c;background: #ffd76a11;font-size: 18px;line-height: 1}\n.bg-slot.add i{font-size: 10px}\n.bg-slot.add u{font-size: 9px;color: #7a849b}\n.bg-slot.add:active{background: #ffd76a22}\n/* 批量分解时格子自己就是勾选框（原来靠下面那串列表勾，列表已撤） */\n.bg-slot.sel{border-color: #d43a4f;background: #d43a4f33}\n.bg-slot.no-sel{opacity: .45}\n/* 货币小卡片（背包） */\n.cur-chips{display: flex;flex-wrap: wrap}\n.cur-chips .cur-chip{font-size: 12px}\n/* 新手高亮引导 */\n.coach-overlay{position: fixed;background: rgba(0,0,0,.55)}\n/* ---------- 批量分解 ---------- */\n.batch-bar{position: fixed;bottom: calc(62px + env(safe-area-inset-bottom) + 8px);left: 50%;width: calc(100% - 16px);max-width: 504px;background: rgba(18,22,34,.97);border: 1px solid #232b3b;border-radius: 14px;padding: 10px 12px}\n.batch-bar .bb-row{display: flex;align-items: center}\n.list-row .sel-box{width: 20px;height: 20px;border-radius: 6px;border: 1.5px solid #232b3b;flex: none;display: flex;align-items: center;justify-content: center;font-size: 13px;color: transparent}\n.list-row.sel{background: rgba(255,215,106,.07);border-radius: 10px}\n.list-row.sel .sel-box{background: #e6b64c;border-color: #e6b64c;color: #241c08;font-weight: 800}\n.list-row.no-sel{opacity: .45}\n.list-row.no-sel .sel-box{opacity: .4}\n.coach-box{position: absolute;border: 2px solid #e6b64c;border-radius: 12px}\n/* 引导气泡：固定 280px 在 320px 的小屏上会顶出右边，改成\"最多 280，窄屏自动让位\" */\n.coach-tip{position: absolute;width: min(280px, calc(100vw - 24px));background: #111621;border: 1px solid #e6b64c;border-radius: 12px;padding: 12px 14px;color: #e9edf6}\n.recruit-card{text-align: center;padding: 8px 4px}\n.recruit-card .avatar{width: 52px;height: 52px;margin: 0 auto 6px}\n.stat-6{display: grid}\n.stat-6 .cell{background: #111621;border-radius: 8px;padding: 8px 4px;text-align: center}\n.stat-6 .cell .v{font-weight: 700;font-size: 14px}\n.stat-6 .cell .k{font-size: 10px;color: #7a849b}\n/* 属性数值面板（角色卡 / 主角卡共用）：两列一屏列全，比一行一项省一半高度 */\n.stat-grid{display: grid}\n.stat-grid .srow{display: flex;align-items: baseline;padding: 5px 0;min-width: 0}\n.stat-grid .srow .rk{color: #7a849b;font-size: 12px;flex: 0 0 auto}\n.stat-grid .srow b{font-size: 13px;font-weight: 600;min-width: 0}\n.eq-tile{display: grid;min-height: 88px;min-width: 0;padding: 8px;background: #111621;border: 1px solid #333e55;border-radius: 6px}\n.eq-tile:active{background: #1d2534}\n.eq-tile.off{border-style: dashed;border-color: #232b3b}\n.eq-slot{font-size: 10px;color: #7a849b}\n.eq-un{margin: -5px -5px 0 0;position: relative;width: 30px;height: 30px;display: grid;padding: 0;background: none;border: none;color: #7a849b;font-size: 10px;line-height: 1}\n.eq-un:active{color: #e9edf6}\n.eq-name{font-size: 12px;font-weight: 600;line-height: 1.25;min-width: 0}\n.eq-brief{font-size: 10px;color: #7a849b;line-height: 1.35;min-width: 0;display: -webkit-box}\n.eq-none{display: grid;font-size: 11px;color: #7a849b;opacity: .6}\n.skill-row{background: #111621;border-radius: 10px;padding: 10px}\n.skill-row .sname{font-weight: 700;font-size: 13px;display: flex;align-items: center}\n.skill-row .sdesc{font-size: 11px;color: #7a849b}\n.corridor-hero{text-align: center;padding: 20px 0 8px}\n.corridor-hero .floor-num{font-size: 44px;font-weight: 800;color: #d43a4f}\n/* ---------- 文字行（对标参考图：`【标签】值` 一行一项，右对齐） ---------- */\n/* 参考产品整屏就是这种行：左边【境界】右边 练气初期，没有任何图标。\n   我们的状态区 / 挂机区 / 属性区统一用它，一行一件事，扫一眼就看完。 */\n.text-rows{margin: 0}\n.text-rows .row{display: flex;align-items: baseline;padding: 7px 0}\n.text-rows .row .rk{color: #7a849b;font-size: 12px;flex: 0 0 auto}\n.text-rows .row .rv{text-align: right;font-size: 13px;font-weight: 600;min-width: 0;max-width: 62%}\n.text-rows .row .rs{color: #7a849b;font-size: 11px;min-width: 0}\n.text-rows .row{flex-wrap: wrap}\n/* ---------- 挂机区：压成三行文字，不再是一块大画面 ---------- */\n.idle-card{padding: 4px 14px 14px}\n.idle-line{display: flex;align-items: baseline;padding: 6px 0;flex-wrap: wrap}\n.idle-line .il-k{color: #7a849b;font-size: 12px;flex: 0 0 auto}\n.idle-line .il-v{color: #e6b64c;font-weight: 700;font-size: 15px}\n.idle-line .il-s{color: #7a849b;font-size: 11px;min-width: 0}\n.idle-line .il-r{text-align: right;font-size: 12px;min-width: 0;max-width: 78%}\n/* ---------- 首页入口：纯文字方块（对标参考图的功能按钮） ---------- */\n/* 参考产品的按钮就是一个描边方块里写两个字：挂机 / 挑战 / 收取 / 排序 / 图鉴。\n   没有图标，靠文字认路。三级字号：名字 13px > 状态 10px。 */\n.text-menu{display: grid}\n.tile{display: flex;flex-direction: column;align-items: center;justify-content: center;min-height: 54px;padding: 8px 6px;background: #111621;border: 1px solid #333e55;border-radius: 6px;color: #e9edf6}\n.tile:active{background: #1d2534}\n.tile .tt-name{font-size: 13px;font-weight: 600;max-width: 100%;line-height: 1.25}\n.tile .tt-sub{font-size: 10px;color: #7a849b;min-height: 12px;max-width: 100%;line-height: 1.35}\n.tile{min-width: 0}\n.tile.locked{opacity: .45}\n.tt-dot{display: inline-block;width: 6px;height: 6px;border-radius: 50%;background: #d43a4f}\n/* V8.6 删掉了没人再用的类：.plaque*（两枚匾额，改成一条主线条）、\n   .hero-num / .hero-bank（大数字主视觉）、.today-card / .today-row（今日卡）、\n   .status-strip（三格状态）——留着会误导后来的改动，一并清掉。\n   （\"改了没人用的类\"这件事在 LESSONS 里记过：删掉比留着安全。） */\n/* 段内小标题：比 section-title 更轻，用来把\"养成\"里的「日常」那半张宫格隔开 */\n.grid-title{font-size: 11px;color: #7a849b;letter-spacing: 2px;margin: 14px 2px 10px}\n/* ---------- 「成长」子页：一行一条养成线 ---------- */\n.grow-row{display: flex;align-items: center;padding: 11px 14px}\n.grow-row .gr-ico{font-size: 22px;flex: 0 0 auto;opacity: .92}\n.grow-row .gr-grow{flex: 1;min-width: 0}\n.grow-row .gr-t1{font-size: 15px;font-weight: 600}\n.grow-row .gr-t2{font-size: 11px;color: #7a849b;line-height: 1.55}\n.grow-row .gr-cur{flex: 0 0 auto;font-size: 12px;color: #e6b64c;text-align: right;max-width: 42%}\n/* ---------- 列表工具栏（筛选 / 排序 / 搜索） ---------- */\n.filter-bar{display: flex;align-items: center}\n.filter-bar .flabel{font-size: 11px;color: #7a849b;flex: 0 0 auto}\n.filter-bar .grow-pills{flex: 1}\n.search-input{flex: 1;min-height: 44px;background: #111621;border: 1px solid #232b3b;border-radius: 10px;color: #e9edf6;font-size: 13px;padding: 0 12px}\n.search-input::placeholder{color: #7a849b}\n/* ---------- 数值跳动（货币收支） ---------- */\n.float-cur{position: absolute;left: 50%;top: -2px;font-size: 11px;font-weight: 800}\n.float-cur.up{color: #56c894}\n.float-cur.down{color: #d43a4f}\n0%{opacity: 1}\n100%{opacity: 0}\n.cur-chip.cur-up{border-color: #56c894}\n.cur-chip.cur-down{border-color: #d43a4f}\n/* ---------- 挂机分工提示 ---------- */\n.idle-lines-hint{font-size: 11px;color: #7a849b;line-height: 1.7}\n/* ---------- 招募卡池 ---------- */\n/* 出率行 / 保底行：招募页和「概率公示」页共用同一套样式（原来只在 .pool-card 内生效，\n   导致公示页里 SR/SSR/UR 挤成一行没有间隔） */\n.rate-row{display: flex;flex-wrap: wrap;font-size: 11px}\n.pity-row{display: flex;flex-wrap: wrap;font-size: 11px;color: #7a849b}\n.pity-row b{color: #e9edf6}\n.up-banner{background: linear-gradient(90deg, #ffd76a22, transparent);border-radius: 6px;padding: 6px 10px;font-size: 11px;line-height: 1.6}\n/* 招募券状态行：一眼看清\"这次到底扣券还是扣货币\" */\n.ticket-row{display: flex;flex-wrap: wrap;align-items: center;font-size: 11px;padding: 6px 9px;border-radius: 8px;border: 1px dashed #232b3b;color: #7a849b}\n.ticket-row.has{border-style: solid;border-color: #ffd76a66;background: linear-gradient(90deg, #ffd76a18, transparent);color: #e9edf6}\n.ticket-row b{color: #e6b64c}\n.ticket-row .ticket-hint{color: #7a849b}\n/* ---------- 境界小阶（大境 × 初/中/后/大圆满） ---------- */\n.step-row{display: flex}\n.step-chip{flex: 1;min-width: 0;text-align: center;border: 1px solid #232b3b;border-radius: 8px;padding: 5px 2px;background: #161d2a}\n.step-chip b{display: block;font-size: 11px;font-weight: 600}\n.step-chip i{display: block;font-size: 9px;color: #7a849b}\n.step-chip.done{border-color: #5dd39e55}\n.step-chip.done b{color: #56c894}\n.step-chip.cur{border-color: #ffd76a;background: linear-gradient(180deg, #ffd76a22, transparent)}\n.step-chip.cur b{color: #e6b64c}\n.fm-row{display: flex;align-items: center;flex-wrap: wrap;font-size: 11px;padding: 6px 0;opacity: .55}\n.fm-row.on{opacity: 1}\n.fm-row .fm-name{font-weight: 700;min-width: 62px}\n.fm-row.on .fm-name{color: #e6b64c}\n.fm-row .fm-req{color: #7a849b}\n.fm-row .fm-buff{color: #56c894}\n.fm-row .fm-on{color: #56c894;font-size: 10px;min-width: 36px;text-align: right}\n/* 结算自动进下一关的倒计时：贴在主按钮文字后面，一眼看到\"还剩几秒\" */\n.b-result .auto-cd{display: inline-block;padding: 0 6px;border-radius: 999px;background: rgba(0,0,0,.28)}\nfrom{opacity: 0}\nto{opacity: 1}";
